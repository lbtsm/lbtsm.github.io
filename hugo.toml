baseURL = "https://blog.lbtsm.site/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
title = "lbtsm 的博客"
theme = "hugo-theme-bootstrap"

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false
buildExpired = false
pygmentsUseClasses = true
timeout = "120s"

[pagination]
  pagerSize = 5

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS"]

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"

[build]
  writeStats = true

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
    [menu.main.params]
      icon = '<i class="fas fa-fw fa-file-alt"></i>'
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
    [menu.main.params]
      icon = '<i class="fas fa-fw fa-tags"></i>'
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 30
    [menu.main.params]
      icon = '<i class="fas fa-fw fa-file-archive"></i>'
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 40
    [menu.main.params]
      icon = '<i class="fas fa-fw fa-search"></i>'
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 50
    [menu.main.params]
      icon = '<i class="fas fa-fw fa-user"></i>'

[params]
  mainSections = ["posts", "datastruct", "webthree"]
  description = "lbtsm 的技术博客 - 记录 Go、区块链、DeFi 等学习笔记"
  brand = "lbtsm 的博客"
  logo = false
  palette = "purple"
  palettes = []
  color = "auto"
  dateFormat = "2006年1月2日"
  titleCase = false
  carouselPostCount = 5
  breadcrumb = true
  readingTime = true
  socialShare = false
  searchBar = true
  comment = false
  toc = true
  tocPosition = "sidebar"
  tocWordCount = 1
  viewer = true
  featuredPostCount = false
  recentPostCount = 5
  relatedPostCount = 5
  categoryCount = 10
  tagCount = 10
  seriesCount = false
  taxonomyPostCount = 20
  countTaxonomyPosts = true
  sidebarTaxonomies = ["categories", "tags"]

  [params.sidebar]
    fixed = true
    collapsed = true
    taxonomiesToggle = true
    taxonomiesToggleArchives = true
    postsToggle = true
    archives = false
    categories = false
    tags = false
    series = false
    featuredPosts = false
    recentPosts = false

  [params.codeBlock]
    lineNos = true
    maxLines = 30

  [params.post]
    excerpt = ""
    excerptMaxLength = 160
    copyright = false
    featuredImage = true
    numberifyHeadings = false
    imageTitleAsCaption = true
    panel = true
    nav = true

  [params.archive]
    dateFormat = "01-02"

  [params.search]
    paginate = 10
    indexPaginate = 100
    maxResults = 50
    [params.search.fuse]
      isCaseSensitive = false
      minMatchCharLength = 2
      threshold = 0.3

  [params.actionsPanel]
    disabled = false

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true

[security.funcs]
  getenv = ['^HUGO_', '^CI$', 'PWD']
