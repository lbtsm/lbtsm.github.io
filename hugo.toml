baseURL = "https://blog.lbtsm.site/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
# 中文站点: 让 .Summary / .WordCount 正确处理 CJK
hasCJKLanguage = true
title = "lbtsm 的博客"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

# 分页 (paginate 已在新版 Hugo 移除, 用 pagination.pagerSize)
[pagination]
  pagerSize = 5

[minify]
  disableXML = true
  minifyOutput = true

# 首页额外输出 JSON, 供 PaperMod 搜索使用
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 导航菜单
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 40
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 50

[params]
  env = "production"
  # 首页列出这些目录下的文章 (不写的话 Hugo 只取文章最多的那个 section)
  mainSections = ["posts", "datastruct"]
  description = "lbtsm 的技术博客 —— 记录 Go、区块链、DeFi 等学习笔记"
  author = "lbtsm"
  defaultTheme = "auto"          # 深/浅色自动跟随系统
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = true                 # 侧边悬浮目录默认展开

  # 首页信息区 (Content 支持 Markdown, 只放封面横幅, 不要标题文字)
  [params.homeInfoParams]
    Title = ""
    Content = """
![博客封面](/img/home-cover.jpg)
"""

  # 搜索页需要的输出配置(见上方 outputs)
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    threshold = 0.4
    minMatchCharLength = 0

# 代码高亮
[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true                # 允许 md 中内嵌 HTML(如图片/表格)
