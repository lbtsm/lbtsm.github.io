baseURL = "https://blog.lbtsm.site/"
locale = "zh-cn"
title = "lbtsm 的博客"
theme = "PaperMod"

# 输出 RSS / sitemap / 首页 JSON(供搜索用)
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

# 分页 (paginate 已在新版 Hugo 移除, 用 pagination.pagerSize)
[pagination]
  pagerSize = 5

[minify]
  disableXML = true
  minifyOutput = true

# 导航菜单
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 30
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 40

[params]
  env = "production"
  description = "lbtsm 的技术博客 —— 记录 Go、区块链、DeFi 等学习笔记"
  author = "lbtsm"
  defaultTheme = "auto"          # 深/浅色自动跟随系统
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  # 首页信息区
  [params.homeInfoParams]
    Title = "👋 欢迎"
    Content = "这里是 lbtsm 的技术博客,记录 Go、区块链与 DeFi 的学习笔记。"

  # 搜索页需要的输出配置(见下方 outputs)
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    threshold = 0.4
    minMatchCharLength = 0

# 首页额外输出 JSON, 供 PaperMod 搜索使用
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 代码高亮
[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true                # 允许 md 中内嵌 HTML(如图片/表格)
