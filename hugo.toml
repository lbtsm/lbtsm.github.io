baseURL = "https://blog.lbtsm.site/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
# 中文站点: 让 .Summary / .WordCount 正确处理 CJK
hasCJKLanguage = true
title = "lbtsm 的博客"
theme = "hugo-theme-stack"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

# 分页 (paginate 已在新版 Hugo 移除, 用 pagination.pagerSize)
[pagination]
  pagerSize = 5

[minify]
  disableXML = true
  minifyOutput = true

[params]
  # 文章所在 section (Stack 默认是 "post", 我们用 "posts")
  mainSections = ["posts"]
  rssFullContent = true
  description = "lbtsm 的技术博客 —— 记录 Go、区块链、DeFi 等学习笔记"

  [params.footer]
    since = 2019

  [params.dateFormat]
    published = "2006-01-02"
    lastUpdated = "2006-01-02"

  # 左侧边栏
  [params.sidebar]
    emoji = "🚀"
    subtitle = "记录 Go、区块链与 DeFi 的学习笔记"

  [params.article]
    headingAnchor = false
    math = false
    toc = true
    readingTime = true
    [params.article.list]
      showTags = true
    [params.article.license]
      enabled = false

  # 首页右侧小组件: 搜索 / 归档 / 分类 / 标签云
  [params.widgets]
    homepage = [
      { type = "search" },
      { type = "archives", params = { limit = 5 } },
      { type = "categories", params = { limit = 10 } },
      { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

  [params.comments]
    enabled = false

  [params.colorScheme]
    toggle = true
    default = "auto"

# 侧边栏社交图标
[menu]
  [[menu.social]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/lbtsm"
    [menu.social.params]
      icon = "brand-github"

# 代码高亮
[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true                # 允许 md 中内嵌 HTML(如图片/表格)
